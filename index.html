<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>♥️ভাস্কর ডিজিটাল স্টুডিও♥️</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;text-align:center;padding:15px;margin:0}
.box{max-width:420px;margin:0 auto}
.card{background:#1e293b;padding:20px;border-radius:20px;max-width:380px;margin:20px auto}
.btn{width:100%;padding:12px;background:linear-gradient(90deg,#fde047,#facc15);color:#000;border:0;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:8px}
#qr{background:#fff!important;padding:25px!important;border-radius:15px;margin:15px auto;display:flex;justify-content:center;min-height:220px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.a{padding:12px;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold;display:block;text-align:center}
.hero{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0 auto;}
.pro{width:170px!important;height:170px!important;border-radius:50%!important;object-fit:cover!important;object-position:50% 10%!important;display:block!important;margin:20px auto!important;border:4px solid #38bdf8!important;box-shadow:0 0 30px rgba(56,189,248,0.6)!important;}
.logo{width:110px;height:110px;border-radius:12px;object-fit:contain;display:block;margin:10px auto}
/* ছোট কোড - হলুদ ব্লক ইনপুট করা হলো */
.cta-box{background:linear-gradient(180deg,#fde047,#facc15);color:#000;border:3px solid #fff;border-radius:24px;padding:18px;margin:15px 0;text-align:left;box-shadow:0 0 0 4px #fde047,0 0 30px #facc15;animation:glow 1.4s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px #fff,0 0 0 8px #fde047,0 0 35px #facc15}50%{box-shadow:0 0 0 6px #fff,0 0 0 12px #fef9c3,0 0 55px #facc15}}
.cta-top{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-weight:900;font-size:19px;line-height:1.2}
.cta-icon{width:46px;height:46px;background:#fef9c3;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.cta-box input{width:100%!important;background:#fff!important;border:2.5px solid #000!important;border-radius:12px!important;padding:13px!important;font-weight:700!important;font-size:14px!important;color:#000!important;margin:0!important}
.poetry-btn{background:linear-gradient(90deg,#ec4899,#8b5cf6);padding:14px;border-radius:12px;margin:12px 0;display:block;color:#fff;text-decoration:none;font-weight:bold;font-size:18px}
.blogger-btn{background:linear-gradient(90deg,#06b6d4,#3b82f6);padding:14px;border-radius:12px;margin:12px 0;display:block;color:#fff;text-decoration:none;font-weight:bold;font-size:18px}
.print-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.print-btn{padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer;font-size:13px;color:#fff}
.modeBtn{padding:11px;border-radius:10px;border:0;font-weight:bold;cursor:pointer;width:100%;font-size:14px}
</style>
</head>
<body>
<div class="box">
<div class="hero">
<img class="pro" src="IMG-20260923-WA3151.jpg" alt="Bhaskar">
<h2>💛ভাস্কর ডিজিটাল💛 ♥️স্টুডিও♥️</h2>
<p>📍 কলকাতা, হাওড়া, লিলুয়া 711204</p>
<p>📞 9674131894 💬9433209439</p>
</div>
<div class="card">
<img class="logo" src="IMG_20260921_230415.jpg" alt="logo">
<h2 style="font-size:16px">🙏প্রিয় ডিজিটাল জগতে আপনাকে সুস্বাগতম🙏</h2>
<a class="poetry-btn" href="https://banikbhaskar373-cmyk.github.io/chetonar-adhar/" target="_blank">💛 চেতনার আধারে 💛 কবিতা📚পরিক্রমা </a>
<a class="blogger-btn" href="https://chetonaradhar373.blogspot.com" target="_blank">বিবস্বানের কবিতা ব্লগার<br><span style="font-size:15px;color:#facc15">chetonaradhar373 ♥️</span></a>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0">
<button id="b1" class="modeBtn" onclick="setM('link')" style="background:#38bdf8;color:#000">🔗 লিঙ্ক QR</button>
<button id="b2" class="modeBtn" onclick="setM('pay')" style="background:#1e293b;color:#fff">💰 টাকা নেওয়ার QR</button>
</div>
<div id="linkBox">
<div id="yellowBlock" class="cta-box">
  <div class="cta-top">
    <div class="cta-icon">🔗</div>
    <div>যে কোনো লিঙ্ক<br>এখানে<br>লিখুন / পেস্ট করুন</div>
  </div>
  <input id="t" type="text" value="https://chetonaradhar373.blogspot.com" placeholder="https://your-link-here.com">
</div>
</div>
<div id="payBox" style="display:none;text-align:left;background:#0f172a;padding:12px;border-radius:12px">
<select id="upi" onchange="make()"><option value="axis">Axis Bank - Main</option><option value="icici">ICICI Bank</option><option value="hdfc">HDFC Bank</option></select>
<input id="pname" value="Bhaskar Banik" oninput="make()">
<input id="amt" type="number" placeholder="টাকা" oninput="make()">
</div>
<button class="btn" onclick="make()">✨ QR কোড তৈরি করুন ✨</button>
<div id="qr"></div>
<div class="print-grid">
<button class="print-btn" onclick="downloadQR()" style="background:linear-gradient(90deg,#4A00E0,#8E2DE2)">⬇️ ডাউনলোড</button>
<button class="print-btn" onclick="printQR()" style="background:linear-gradient(90deg,#FF6F00,#FFAB40)">🖨️ প্রিন্ট</button>
<button class="print-btn" onclick="shareQR()" style="background:linear-gradient(90deg,#00C853,#64DD17)">📤 শেয়ার</button>
</div>
<div class="grid">
<a class="a" style="background:#22c55e" href="tel:+919674131894">📞 কল 1</a>
<a class="a" style="background:#25D366" href="https://wa.me/919433209439">💬 WhatsApp</a>
<a class="a" style="background:#f59e0b" href="mailto:banikbhaskar373@gmail.com">📧 Email</a>
<a class="a" style="background:#ef4444" href="https://maps.app.goo.gl/dJrXf6unBqNAvzjR9?g_st=aw" target="_blank">📍 লোকেশন</a>
</div>
</div>
</div>
<script>
const SECURE_UPI_MAP = {"axis": atob("YmFuaWtiaGFza2FyMzczLTFAb2theGlz"),"icici": atob("YmFuaWtiaGFza2FyMzczLTFAaWNpY2k="),"hdfc": atob("YmFuaWtiaGFza2FyMzczLTFAb2toZGZjYmFuaw==")};
let mode='link';
function setM(m){mode=m;document.getElementById('linkBox').style.display=m==='link'?'block':'none';document.getElementById('payBox').style.display=m==='pay'?'block':'none';document.getElementById('b1').style.background=m==='link'?'#38bdf8':'#1e293b';document.getElementById('b2').style.background=m==='pay'?'#22c55e':'#1e293b';make();}
function make(){let box=document.getElementById('qr');let txt='';if(mode==='link'){txt=document.getElementById('t').value.trim();}else{let upi=SECURE_UPI_MAP[document.getElementById('upi').value];let name=document.getElementById('pname').value.trim()||'Bhaskar Banik';let amt=document.getElementById('amt').value.trim();txt=`upi://pay?pa=${upi}&pn=${encodeURIComponent(name)}&cu=INR`;if(amt) txt+=`&am=${amt}`;}if(!txt) return;box.innerHTML='';new QRCode(box,{text:txt,width:240,height:240});}
function getWhiteQR(){let c=document.querySelector('#qr canvas');if(!c) return null;let size=1000,border=120,temp=document.createElement('canvas');temp.width=size;temp.height=size;let ctx=temp.getContext('2d');ctx.fillStyle="#ffffff";ctx.fillRect(0,0,size,size);ctx.drawImage(c,border,border,size-border*2,size-border*2);return temp;}
function downloadQR(){let wq=getWhiteQR();if(!wq){alert('আগে QR বানান');return;}let a=document.createElement('a');a.href=wq.toDataURL('image/png');a.download='Bhaskar-QR-'+Date.now()+'.png';a.click();}
function printQR(){let wq=getWhiteQR();if(!wq) return;let src=wq.toDataURL();let w=window.open('','','width=800,height=900');w.document.write('<html><body style="text-align:center;padding:30px"><h2>💛 ভাস্কর ডিজিটাল স্টুডিও 💛</h2><img src="'+src+'" style="width:450px;height:450px"></body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),600);}
function shareQR(){let wq=getWhiteQR();if(!wq){alert('আগে QR বানান');return;}wq.toBlob(function(blob){let file=new File([blob],"Bhaskar-QR.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'QR'}).catch(()=>{});}else{downloadQR();}},'image/png');}
window.addEventListener('load',make);
document.getElementById('t').addEventListener('input',make);
</script>
</body>
</html>
