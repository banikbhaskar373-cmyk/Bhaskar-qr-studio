<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভাস্কর ডিজিটাল</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{background:#020617;color:#fff;font-family:sans-serif;padding:12px}
.box{max-width:480px;margin:auto}
.hero{background:#0f172a;border-radius:24px;padding:20px;text-align:center}
.pro{width:110px;height:110px;border-radius:50%;border:3px solid #38bdf8;object-fit:cover;margin:auto}
.card{background:#0f172a;border-radius:18px;padding:14px;margin-top:12px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff}
.btn{width:100%;padding:12px;border-radius:10px;background:#38bdf8;color:#000;font-weight:800;border:none;margin-top:8px}
#qr{background:#fff;border-radius:12px;padding:10px;margin-top:10px;display:flex;justify-content:center}
a.call{display:block;background:#22c55e;color:#000;padding:12px;border-radius:10px;text-align:center;margin-top:10px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="box">
<div class="hero">
<img class="pro" src="https://i.pravatar.cc/300">
<h2 style="color:#38bdf8;margin:10px 0">ভাস্কর ডিজিটাল</h2>
<p>📍 কলকাতা - 700062</p>
<p>📞 9674131894 | 💬 9433209439</p>
<p style="font-size:12px;background:#1e293b;padding:8px;border-radius:8px">❤️ প্রিয় কোলকাতায় স্বাগতম 🙏</p>
</div>
<div class="card">
<input id="t" value="https://banikbhaskar373-cmyk.github.io/Bhaskar-qr-studio/">
<button class="btn" onclick="make()">✨ QR বানান</button>
<div id="qr"></div>
<a class="call" href="tel:+919674131894">📞 কল করুন</a>
</div>
</div>
<script>
function make(){
var v=document.getElementById('t').value;
document.getElementById('qr').innerHTML='';
new QRCode(document.getElementById('qr'),{text:v,width:200,height:200});
}
make();
</script>
</body>
</html>
