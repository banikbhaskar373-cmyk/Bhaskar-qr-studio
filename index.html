<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভাস্কর ডিজিটাল</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{background:#020617;color:#e2e8f0;font-family:sans-serif;padding:10px}
.box{max-width:520px;margin:auto}
.hero{background:linear-gradient(135deg,#0f172a,#1e1b4b);border-radius:28px;padding:22px;text-align:center}
.profile{width:130px;height:130px;border-radius:50%;border:4px solid #38bdf8;object-fit:cover;margin:auto;display:block}
.card{background:#0f172a;border-radius:20px;padding:18px;margin-top:14px}
input{width:100%;padding:14px;border-radius:12px;background:#020617;color:#fff;border:1px solid #334155}
.btn{width:100%;padding:14px;border-radius:12px;background:linear-gradient(90deg,#38bdf8,#818cf8);font-weight:800;margin-top:10px;border:none}
#qrcode{background:#fff;border-radius:16px;padding:18px;margin-top:12px;display:flex;justify-content:center}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.contact a{text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:800}
.call{background:#22c55e;color:#052e16}.wa{background:#25D366;color:#052e16}
</style>
</head>
<body>
<div class="box">
<div class="hero">
<img src="data:image/jpeg;base64,[IMAGE_BASE64_1]" class="profile">
<h1 style="color:#38bdf8">ভাস্কর ডিজিটাল</h1>
<p>📍 কলকাতা - 700108</p>
<p>📞 9674131894 | 💬 9433209439</p>
<p>❤️ প্রিয় কোলকাতার বুকে নতুন QR দোকানে স্বাগতম 🙏</p>
</div>
<div class="card">
<input id="t" value="https://banikbhaskar373-cmyk.github.io/Bhaskar-qr-studio/">
<button class="btn" onclick="make()">✨ QR বানান</button>
<div id="qrcode"></div>
<div class="contact">
<a href="tel:+919674131894" class="call">📞 কল<br>9674131894</a>
<a href="https://wa.me/919433209439" class="wa">💬 WhatsApp<br>9433209439</a>
</div>
</div>
</div>
<script>
function make(){var v=document.getElementById('t').value;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:v,width:240,height:240});}
window.onload=make;
</script>
</body>
</html>
