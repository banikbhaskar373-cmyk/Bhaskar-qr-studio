<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>♥️ভাস্কর ডিজিটাল স্টুডিও - QR বিজনেস♥️</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;text-align:center;padding:15px;margin:0}
.box{max-width:420px;margin:0 auto}
.card{background:#1e293b;padding:20px;border-radius:20px;max-width:380px;margin:20px auto}
input{width:100%;padding:12px;border-radius:10px;border:0;margin:10px 0;box-sizing:border-box;font-size:15px}
.btn{width:100%;padding:12px;background:#38bdf8;border:0;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
#qr{background:#ffffff!important;padding:25px!important;border-radius:16px;margin:16px auto;display:flex;justify-content:center;align-items:center;min-height:240px}
#qr canvas,#qr img{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.a{padding:12px;border-radius:10px;color:#fff;text-decoration:none;font-weight:bold;display:block;text-align:center}
.hero{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:0 auto;}
.pro{width:170px!important;height:170px!important;border-radius:50%!important;object-fit:cover!important;object-position:50% 10%!important;display:block!important;margin:20px auto!important;border:4px solid #38bdf8!important;box-shadow:0 0 30px rgba(56,189,248,0.6)!important;}
.logo{width:110px;height:110px;border-radius:12px;object-fit:contain;display:block;margin:10px auto}
.cta-box{background:linear-gradient(90deg,#fef08a,#facc15); color:#000; border:2px dashed #000; padding:13px;border-radius:12px;margin:15px 0;font-weight:bold;font-size:17px}
.print-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.print-btn{padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer;font-size:13px;color:#fff}
</style>
</head>
<body>
<div class="box">
<div class="hero">
<img class="pro" src="IMG-20260923-WA3151.jpg">
<h2>💛ভাস্কর ডিজিটাল💛 ♥️স্টুডিও♥️</h2>
<p>📍 কলকাতা, হাওড়া, লিলুয়া 711204</p>
<p>📞 9674131894 💬9433209439</p>
</div>
<div class="card">
<h2>🙏QR বিজনেস সেন্টার🙏</h2>
<div class="cta-box">👇 কাস্টমারের লিঙ্ক এখানে পেস্ট করুন 👇</div>
<input id="t" type="text" value="https://chetonaradhar373.blogspot.com" oninput="make()" placeholder="এখানে লিঙ্ক লিখুন...">
<button class="btn" onclick="make()">✨ QR বানান ✨</button>
<div id="qr"></div>

<div class="print-grid">
  <button class="print-btn" onclick="downloadQR()" style="background:linear-gradient(90deg,#4A00E0,#8E2DE2)">⬇️ ডাউনলোড</button>
  <button class="print-btn" onclick="printQR()" style="background:linear-gradient(90deg,#FF6F00,#FFAB40)">🖨️ প্রিন্ট</button>
  <button class="print-btn" onclick="shareQR()" style="background:linear-gradient(90deg,#00C853,#64DD17)">📤 শেয়ার</button>
</div>

<div class="grid">
<a class="a" style="background:#22c55e" href="tel:+919674131894">📞 কল</a>
<a class="a" style="background:#25D366" href="https://wa.me/919433209439">💬 WhatsApp</a>
<a class="a" style="background:#f59e0b" href="mailto:banikbhaskar373@gmail.com">📧 Email</a>
<a class="a" style="background:#ef4444" href="https://maps.app.goo.gl/dJrXf6unBqNAvzjR9?g_st=aw" target="_blank">📍 লোকেশন</a>
</div>
</div>
</div>

<script>
function make(){
  var box=document.getElementById('qr');
  var v=document.getElementById('t').value.trim();
  if(!v){ box.innerHTML="<p style='color:#000'>লিঙ্ক লিখুন</p>"; return; }
  box.innerHTML="";
  // বিজনেস কোয়ালিটি: L লেভেল, 260px
  new QRCode(box,{text:v,width:260,height:260,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.L});
}

// বিজনেসের আসল জাদু - সাদা কাগজে QR তৈরি
function getWhiteQR(){
  let c=document.querySelector('#qr canvas');
  if(!c) return null;
  let size=800;
  let border=80;
  let temp=document.createElement('canvas');
  temp.width=size; temp.height=size;
  let ctx=temp.getContext('2d');
  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,size,size);
  ctx.drawImage(c,border,border,size-border*2,size-border*2);
  return temp;
}

function downloadQR(){
  let whiteQR=getWhiteQR();
  if(!whiteQR){ alert('আগে QR বানান গুরুদেব'); return; }
  let a=document.createElement('a');
  a.href=whiteQR.toDataURL('image/png');
  a.download='Bhaskar-QR-'+Date.now()+'.png';
  a.click();
}

function printQR(){
  let whiteQR=getWhiteQR();
  if(!whiteQR){ alert('আগে QR বানান'); return; }
  let src=whiteQR.toDataURL();
  let link=document.getElementById('t').value;
  let w=window.open('','','width=800,height=900');
  w.document.write('<html><body style="text-align:center;font-family:system-ui;padding:30px"><h2>💛 ভাস্কর ডিজিটাল স্টুডিও 💛</h2><img src="'+src+'" style="width:400px;height:400px;border:2px solid #000"><p style="word-break:break-all">'+link+'</p><p>📍 কলকাতা, হাওড়া, লিলুয়া 711204 | 📞 9674131894</p><p>স্ক্যান করুন</p></body></html>');
  w.document.close(); w.focus();
  setTimeout(()=>w.print(),500);
}

function shareQR(){
  let v=document.getElementById('t').value.trim();
  if(navigator.share){ navigator.share({title:'ভাস্কর ডিজিটাল',url:v}); }
  else { window.open('https://wa.me/?text='+encodeURIComponent(v),'_blank'); }
}
make();
</script>
</body>
</html>
