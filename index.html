<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhaskar Digital - Kolkata</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;padding:15px}
.container{max-width:480px;margin:auto}
.header{text-align:center;padding:25px;background:#1e293b;border-radius:20px;margin-bottom:15px}
.header h1{color:#38bdf8;font-size:28px}
.card{background:#1e293b;border-radius:18px;padding:20px;margin-bottom:15px}
input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:white;margin-bottom:10px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#38bdf8;color:#0f172a;font-weight:700;font-size:17px}
#qrcode{display:flex;justify-content:center;padding:20px;background:white;border-radius:16px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>ভাস্কর ডিজিটাল</h1>
<p>📍 কলকাতা - ৭০০০৬২ | প্রিয় কলকাতার বুকে নতুন ভাবনার QR দোকানে স্বাগতম 🙏</p>
</div>
<div class="card">
<h2>🔗 QR বানান</h2>
<input id="qrText" type="text" placeholder="লিঙ্ক বা ফোন নম্বর লিখুন">
<button class="btn" onclick="makeQR()">QR তৈরি করুন</button>
<div id="qrcode">এখানে QR আসবে</div>
</div>
<div class="card" style="text-align:center;background:linear-gradient(135deg,#1e1b4b,#312e81)">
<h3>✨ কবিতা</h3>
<p>আলো হাতে হাঁটি আমি, অন্ধকারের ভিড়ে,<br>স্বপ্ন বুনি ডিজিটালে, তোমার সাধের নীড়ে।</p>
</div>
</div>
<script>
function makeQR(){
var t=document.getElementById('qrText').value;
if(!t){alert('জুড়ে থেকো আমার সাথে, খুশি দেবো তোমার হাতে!');return;}
document.getElementById('qrcode').innerHTML='';
new QRCode(document.getElementById('qrcode'),{text:t,width:220,height:220});
}
window.onload=function(){document.getElementById('qrText').value='https://banikbhaskar373-cmyk.github.io/Bhaskar-qr-studio/';makeQR();}
</script>
</body>
</html>
