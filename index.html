<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhaskar Digital Studio - QR দোকান</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:sans-serif; background: radial-gradient(circle at top,#fff7e6,#ffe0a3); margin:0; padding:20px; text-align:center;}
.card{max-width:480px; margin:20px auto; background:white; border-radius:24px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.15);}
h1{margin:5px 0; color:#6d4c00;}
input{width:90%; padding:14px; border-radius:30px; border:2px solid #ffb300; font-size:16px; text-align:center;}
.btn{width:100%; padding:14px; border:none; border-radius:30px; margin:8px 0; font-weight:bold; color:white; font-size:16px; cursor:pointer; display:block; text-decoration:none;}
.qr-box{margin:18px auto; padding:15px; background:#fffbe6; border-radius:18px; min-height:220px; display:flex; justify-content:center; align-items:center;}
.a-github{background:linear-gradient(90deg,#24292e,#000);}
.a-blogger{background:linear-gradient(90deg,#ff5722,#ff9800);}
.a-qr{background:linear-gradient(90deg,#3b82f6,#06b6d4);}
</style>
</head>
<body>
<div class="card">
<h1>🪔 ভাস্কর ডিজিটাল স্টুডিও 🪔</h1>
<p>❤️ বিবেকের আলোক দর্শন ❤️</p>
<p style="font-weight:bold;">ওয়েবসাইটের ঠিকানা লিখলেই QR</p>
<input id="urlInput" type="text" placeholder="যেমন: chetonaradhar373.blogspot.com" oninput="makeQR()">
<div id="qrcode" class="qr-box"></div>
<button class="btn" style="background:#ffb300;color:#5a3d00;" onclick="downloadQR()">⬇️ QR ডাউনলোড করুন</button>

<a class="btn a-github" href="https://banikbhaskar373-cmyk.github.io/chetonar-adhar/" target="_blank">📖 চেতনার আধার (GitHub)</a>
<a class="btn a-blogger" href="https://chetonaradhar373.blogspot.com" target="_blank">📝 চেতনার আধার (Blogger)</a>
<a class="btn a-qr" href="https://banikbhaskar373-cmyk.github.io/Bhaskar-qr-studio/" target="_blank">🌐 QR স্টুডিও</a>

<p style="font-size:13px; color:#8a6d3b;">এক ঠিকানা লিখলেই QR - এই হলো আসল জাদু!</p>
</div>
<script>
let qr;
function makeQR(){
 let url = document.getElementById('urlInput').value.trim();
 if(!url) return;
 if(!url.startsWith('http')) url = 'https://' + url;
 document.getElementById('qrcode').innerHTML='';
 qr = new QRCode(document.getElementById('qrcode'), {text: url, width:200, height:200});
}
function downloadQR(){
 let canvas = document.querySelector('#qrcode canvas');
 if(!canvas){ alert('আগে ঠিকানা লিখুন গুরুদেব!'); return;}
 let link = document.createElement('a');
 link.download = 'Bhaskar-QR.png';
 link.href = canvas.toDataURL();
 link.click();
}
window.onload = ()=>{ document.getElementById('urlInput').value='chetonaradhar373.blogspot.com'; makeQR(); }
</script>
</body>
</html>
